# Netlify deploys this Next.js App Router site with the Next.js Runtime
# (@netlify/plugin-nextjs, the current OpenNext-based adapter — not the old
# legacy plugin). It supports Server Components, static generation, and
# next/image via the Netlify Image CDN. The plugin is declared explicitly
# because a git-connected build created via the API did not auto-engage it,
# which published the raw .next folder as static files (every route 404'd).
#
# Set these in Site settings -> Environment variables (see .env.example):
#   NEXT_PUBLIC_SITE_URL      e.g. https://<your-site>.netlify.app
#   NEXT_PUBLIC_ENQUIRY_EMAIL enquiry mailto target

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
